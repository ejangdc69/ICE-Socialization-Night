<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-In — A Night in Monte Carlo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --felt: #0a0e13;
    --felt-deep: #05070a;
    --ivory: #f3ede1;
    --gold: #d4af37;
    --green: #4a9d6e;
    --red: #b3423a;
    --amber: #c98a2c;
    --font-display: 'Playfair Display', serif;
    --font-structure: 'Oswald', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--felt-deep);
    color: var(--ivory);
    font-family: var(--font-structure);
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    text-align: center;
    padding: 14px 12px 10px;
    flex-shrink: 0;
  }
  header .eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }
  header h1 {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 22px;
    margin: 4px 0 0;
  }

  #scanner-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  #reader { width: min(92vw, 420px); min-height: 260px; }
  #reader video {
    border-radius: 10px;
    width: 100% !important;
    height: auto !important;
  }

  .scan-error {
    margin-top: 16px;
    padding: 14px 16px;
    border: 1px solid var(--red);
    background: rgba(179,66,58,0.12);
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--ivory);
    max-width: 90vw;
    display: none;
  }
  .scan-error.show { display: block; }

  .manual-toggle {
    flex-shrink: 0;
    display: block;
    margin: 6px auto 0;
    background: none;
    border: none;
    color: rgba(243,237,225,0.4);
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px 10px;
  }
  .manual-entry {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 6px 16px 10px;
    align-items: center;
  }
  .manual-entry input {
    flex: 1;
    background: rgba(243,237,225,0.06);
    border: 1px solid rgba(212,175,55,0.3);
    color: var(--ivory);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
  }
  .manual-entry input::placeholder { color: rgba(243,237,225,0.35); }
  .manual-entry button {
    background: var(--gold);
    color: var(--felt-deep);
    border: none;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .scan-hint {
    position: absolute;
    bottom: 18px;
    left: 0; right: 0;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(243,237,225,0.5);
  }

  /* ---- Result overlay ---- */
  #result {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
    z-index: 10;
  }
  #result.show { display: flex; }
  #result.valid { background: var(--green); }
  #result.duplicate { background: var(--amber); }
  #result.invalid, #result.not_found, #result.error { background: var(--red); }

  #result .icon { font-size: 64px; line-height: 1; margin-bottom: 10px; }
  #result .status-label {
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 18px;
    opacity: 0.9;
  }
  #result .guest-name {
    font-family: var(--font-display);
    font-size: 34px;
    font-style: italic;
    margin: 0 0 6px;
  }
  #result .guest-detail {
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: 0.04em;
    opacity: 0.92;
    margin: 2px 0;
  }
  #result .dismiss-note {
    margin-top: 28px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.75;
  }

  #stats {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    gap: 22px;
    padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: rgba(243,237,225,0.6);
  }
  #stats b { color: var(--gold); font-weight: 600; }
  .stats-note {
    flex-shrink: 0;
    text-align: center;
    padding: 0 16px calc(10px + env(safe-area-inset-bottom));
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: rgba(243,237,225,0.35);
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="eyebrow">PSG-ICE · Door Check-In</div>
    <h1>A Night in Monte Carlo</h1>
  </header>

  <div id="scanner-wrap">
    <div id="reader"></div>
    <div class="scan-hint" id="scan-hint">Point camera at guest's ticket QR</div>
  </div>

  <div class="scan-error" id="scan-error"></div>

  <button class="manual-toggle" id="manual-toggle">Trouble scanning? Staff manual entry</button>
  <div class="manual-entry" id="manual-entry" style="display:none;">
    <input type="text" id="manual-id" placeholder="Type ticket ID number…" autocomplete="off" autocapitalize="off">
    <button id="manual-submit">Check In</button>
  </div>

  <div id="stats">
    <span>This device — In: <b id="stat-valid">0</b></span>
    <span>Dup: <b id="stat-dup">0</b></span>
    <span>Failed: <b id="stat-invalid">0</b></span>
  </div>
  <div class="stats-note">Counts are per-device only. The Google Sheet's "Checked In" column is the real total across all devices.</div>
</div>

<div id="result">
  <div class="icon" id="r-icon">—</div>
  <div class="status-label" id="r-status">—</div>
  <div class="guest-name" id="r-name">—</div>
  <div class="guest-detail" id="r-team">—</div>
  <div class="guest-detail" id="r-id">—</div>
  <div class="dismiss-note">Tap anywhere to scan next guest</div>
</div>

<script>
  // === CONFIGURE THIS ===
  // Paste the Apps Script Web App URL here once deployed (ends in /exec)
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVeMTb0yk_FZlYfEHCyYGcfxEnzBhSrxOcpSuwB62-neywFep1kpo6djOD4O586Af2lg/exec';

  // Optional: must match ACCESS_KEY in CheckInScript.gs if you set one there.
  // Leave both blank to skip this (fine for a low-stakes one-night event).
  const ACCESS_KEY = '';

  const TEAM_LABELS = {
    lucarians: 'Lucarians',
    monarchs: 'Monarchs',
    vesperians: 'Vesperians',
    faculty: 'Faculty Guest',
    guest: 'Guest',
  };

  const stats = { valid: 0, duplicate: 0, invalid: 0 };
  let busy = false;

  function extractId(scannedText) {
    // Ticket QR encodes a full URL like ...?...&id=XXXXX
    try {
      const url = new URL(scannedText);
      const id = url.searchParams.get('id');
      if (id) return id;
    } catch (e) {
      // Not a URL — maybe raw ID was scanned directly
    }
    return scannedText.trim();
  }

  async function verify(id, isRetry) {
    const key = ACCESS_KEY ? `&key=${encodeURIComponent(ACCESS_KEY)}` : '';
    const res = await fetch(`${APPS_SCRIPT_URL}?id=${encodeURIComponent(id)}${key}`);
    if (!res.ok) throw new Error('Network error');
    const data = await res.json();

    // Tally's Sheets sync isn't instant. If someone scans within a couple
    // seconds of submitting, the row may not have landed in the sheet yet —
    // one silent retry after a short wait handles that race without
    // making staff manually rescan.
    if (data.status === 'not_found' && !isRetry) {
      await new Promise(r => setTimeout(r, 2500));
      return verify(id, true);
    }
    return data;
  }

  function showResult(status, data) {
    const el = document.getElementById('result');
    el.className = 'show ' + status;

    const icons = { valid: '✓', duplicate: '⟳', not_found: '✕', invalid: '✕', error: '!' };
    const labels = {
      valid: 'Welcome — Entry Granted',
      duplicate: 'Already Checked In',
      not_found: 'No Matching Registration',
      invalid: 'Invalid Ticket',
      error: 'System Error — Check Manually',
    };

    document.getElementById('r-icon').textContent = icons[status] || '?';
    document.getElementById('r-status').textContent = labels[status] || status;
    document.getElementById('r-name').textContent = data.name || '—';
    document.getElementById('r-team').textContent = data.team
      ? (TEAM_LABELS[data.team] || data.team)
      : (data.message || '');
    document.getElementById('r-id').textContent = data.idnum ? ('ID: ' + data.idnum) : '';

    if (status === 'valid') stats.valid++;
    else if (status === 'duplicate') stats.duplicate++;
    else stats.invalid++;
    document.getElementById('stat-valid').textContent = stats.valid;
    document.getElementById('stat-dup').textContent = stats.duplicate;
    document.getElementById('stat-invalid').textContent = stats.invalid;

    // Haptic feedback so staff don't have to watch the screen for every scan
    if (navigator.vibrate) {
      navigator.vibrate(status === 'valid' ? 80 : [60, 60, 60]);
    }
  }

  document.getElementById('result').addEventListener('click', () => {
    dismissGen++; // invalidate any pending auto-dismiss for this scan
    document.getElementById('result').classList.remove('show');
    busy = false;
  });

  const html5QrCode = new Html5Qrcode('reader');

  async function onScanSuccess(decodedText) {
    if (busy) return;
    busy = true;
    await runCheckIn(extractId(decodedText));
  }

  async function runCheckIn(id) {
    if (!id) { busy = false; return; }

    if (APPS_SCRIPT_URL.includes('PASTE_YOUR')) {
      showResult('error', { message: 'Scanner not configured yet — set APPS_SCRIPT_URL in the page source.' });
      scheduleAutoDismiss();
      return;
    }

    try {
      const data = await verify(id);
      showResult(data.status, data);
    } catch (e) {
      showResult('error', { message: 'Could not reach verification server.' });
    } finally {
      scheduleAutoDismiss();
    }
  }

  let dismissGen = 0;

  function scheduleAutoDismiss() {
    // Guarantees the scanner never gets stuck waiting for a tap that doesn't
    // come — a missed dismiss shouldn't be able to stall the whole line.
    // Generation counter guards against a stale timeout clearing state for
    // a *newer* scan if staff dismiss manually and rescan quickly.
    const gen = ++dismissGen;
    setTimeout(() => {
      if (gen !== dismissGen) return;
      document.getElementById('result').classList.remove('show');
      busy = false;
    }, 1800);
  }

  // ---- Manual entry fallback: deliberately hidden behind a toggle so it's
  // a staff action, not a front-and-center self-check-in box anyone at the
  // door can use without ever holding a ticket. ----
  document.getElementById('manual-toggle').addEventListener('click', () => {
    const box = document.getElementById('manual-entry');
    const showing = box.style.display !== 'none';
    box.style.display = showing ? 'none' : 'flex';
    if (!showing) document.getElementById('manual-id').focus();
  });
  document.getElementById('manual-submit').addEventListener('click', () => {
    const input = document.getElementById('manual-id');
    const val = input.value.trim();
    if (!val || busy) return;
    busy = true;
    runCheckIn(val);
    input.value = '';
  });
  document.getElementById('manual-id').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('manual-submit').click();
  });

  // ---- Camera init, with real error surfacing instead of a silent black screen ----
  function showCameraError(message) {
    const el = document.getElementById('scan-error');
    el.textContent = message;
    el.classList.add('show');
    document.getElementById('scan-hint').textContent = 'Camera unavailable — use manual entry below.';
  }

  async function initCamera() {
    // Diagnostic checks first — these turn "black screen, no idea why" into
    // an actual on-screen answer instead of another round of guessing.
    if (typeof Html5Qrcode === 'undefined') {
      return showCameraError('Scanner library failed to load (CDN blocked or no internet on first load). Reload the page, or use manual entry below.');
    }
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return showCameraError('This page has no camera access in its current context (protocol: ' + location.protocol + '). ' +
        'This usually means the page was opened inside an app\'s built-in browser (e.g. tapped from Messenger/Facebook) ' +
        'or as a downloaded file, rather than the real page. Open the https:// link directly in Chrome or Safari, not from inside another app.');
    }

    let cameras = [];
    try {
      cameras = await Html5Qrcode.getCameras();
    } catch (err) {
      return showCameraError('Could not list cameras (' + (err && err.message || err) + '). Use manual entry below.');
    }
    if (!cameras.length) {
      return showCameraError('No camera detected on this device. Use manual entry below.');
    }

    // This library version's own validator only accepts facingMode as a
    // plain string or { exact: ... } — NOT { ideal: ... }, which is valid
    // browser getUserMedia syntax but fails this library's internal check
    // with "'facingMode' should be string or object with exact as key."
    // Plain string is safest: it degrades gracefully on devices with only
    // one camera, unlike { exact: ... } which hard-fails if no rear camera.
    try {
      await html5QrCode.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: (viewfinderWidth, viewfinderHeight) => {
            const edge = Math.min(viewfinderWidth, viewfinderHeight) * 0.72;
            return { width: edge, height: edge };
          },
        },
        onScanSuccess,
        () => {} // ignore per-frame scan misses, not real errors
      );
    } catch (err) {
      // Fallback: some devices/browsers reject facingMode entirely (rare,
      // but seen on some iOS Safari versions) — retry with the first
      // available camera by id instead of a facingMode constraint.
      try {
        await html5QrCode.start(
          cameras[0].id,
          {
            fps: 10,
            qrbox: (viewfinderWidth, viewfinderHeight) => {
              const edge = Math.min(viewfinderWidth, viewfinderHeight) * 0.72;
              return { width: edge, height: edge };
            },
          },
          onScanSuccess,
          () => {}
        );
      } catch (err2) {
        showCameraError('Could not start the camera (' + (err2 && err2.message || err2) + '). Use manual entry below, or reload the page.');
      }
    }
  }

  initCamera();
</script>

</body>
</html>
